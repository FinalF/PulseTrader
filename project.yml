name: PulseTrader
options:
  bundleIdPrefix: com.flame.pulsetrader
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  PulseTrader:
    type: application
    platform: iOS
    sources:
      - path: Sources/PulseTrader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flame.pulsetrader
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  PulseTraderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PulseTraderTests
    dependencies:
      - target: PulseTrader
        embed: false
schemes:
  PulseTrader:
    build:
      targets:
        PulseTrader: all
        PulseTraderTests: [test]
    test:
      targets:
        - PulseTraderTests
